# Deploy:  fly launch --no-deploy  (once, keep this file)
#          fly volumes create rundown_data --size 1 --region fra
#          fly secrets set EDITOR_PIN=xxxx SESSION_SECRET=$(openssl rand -hex 32)
#          fly deploy
app = "utopian-hours-rundown"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[[mounts]]
  source = "rundown_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite lives on the volume: keep exactly one machine running
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
